name: Release

# Git is the development repository; the WordPress.org SVN repository only
# receives releases. Publishing a GitHub release (tag vX.Y.Z) runs the full CI,
# builds the plugin and deploys it to SVN: trunk, tags/X.Y.Z and assets.
#
# Running the workflow manually (workflow_dispatch) is always a dry run: build,
# validate, show the SVN changes and upload the zip as an artifact. Nothing is
# committed to SVN.
#
# Required repository secrets: SVN_USERNAME, SVN_PASSWORD (wp.org SVN password).

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: wordpress-org-release
  cancel-in-progress: false

env:
  SLUG: flowd-kochmodus

jobs:
  quality:
    name: Quality gate
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to WordPress.org SVN
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify version declarations
        id: version
        run: |
          expected=""
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          version="$(bash .github/scripts/check-version.sh "$expected")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --no-progress

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gutenberg block
        run: pnpm build

      - name: Install Subversion
        run: command -v svn > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq subversion)

      - name: Deploy to WordPress.org SVN
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'release' && '0' || '1' }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SOURCE_URL: ${{ github.event.release.html_url }}
          ZIP_PATH: ${{ github.workspace }}/dist/${{ env.SLUG }}.zip
        run: bash .github/scripts/svn-deploy.sh

      - name: Attach zip to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${SLUG}.zip" --clobber

      - name: Upload zip as workflow artifact (dry run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SLUG }}-${{ steps.version.outputs.version }}
          path: dist/${{ env.SLUG }}.zip
          if-no-files-found: error

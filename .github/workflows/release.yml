name: Release

# Git is the development repository; the WordPress.org SVN repository only
# receives releases. Pushing a semantic version tag (1.0.1, no leading v)
# runs the full CI, builds the plugin, deploys it to SVN (trunk, assets,
# tags/1.0.1) and creates the GitHub release with the changelog and the zip.
# Pre-release tags such as 1.1.0-beta.1 do not match the pattern and are not
# deployed.
#
# The tag must point to a commit on the default branch (main), otherwise the
# run fails before anything is deployed.
#
# Re-running a failed release for a version that already exists as
# tags/X.Y.Z in SVN does not touch SVN: the tag is verified against the
# source, the zip is rebuilt and the GitHub release is created or completed.
#
# Running the workflow manually (workflow_dispatch) is always a dry run: build,
# validate, show the SVN changes and upload the zip as an artifact. Nothing is
# committed to SVN and no GitHub release is created.
#
# Required repository secrets: SVN_USERNAME, SVN_PASSWORD (wp.org SVN password).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: wordpress-org-release
  cancel-in-progress: false

env:
  SLUG: flowd-kochmodus

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to WordPress.org SVN
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so that the tag can be checked against main.
          fetch-depth: 0

      # A tag on an unmerged branch would publish code that is not on main.
      - name: Verify tag is on the default branch
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to $(git rev-parse --short HEAD), which is not on ${DEFAULT_BRANCH}. Merge first, then tag a commit on ${DEFAULT_BRANCH}."
            exit 1
          fi

      - name: Verify version declarations
        id: version
        run: |
          expected=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected="$GITHUB_REF_NAME"
          fi
          version="$(bash .github/scripts/check-version.sh "$expected")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --no-progress

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gutenberg block
        run: pnpm build

      - name: Install Subversion
        run: command -v svn > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq subversion)

      - name: Deploy to WordPress.org SVN
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'push' && '0' || '1' }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SOURCE_URL: ${{ github.event_name == 'push' && format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name) || '' }}
          ZIP_PATH: ${{ github.workspace }}/dist/${{ env.SLUG }}.zip
        run: bash .github/scripts/svn-deploy.sh

      # Kept for every run so the zip can be recovered if a later step fails.
      - name: Upload zip as workflow artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SLUG }}-${{ steps.version.outputs.version }}
          path: dist/${{ env.SLUG }}.zip
          if-no-files-found: ignore
          overwrite: true

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/changelog-entry.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/${SLUG}.zip" --clobber
          else
            gh release create "$TAG" "dist/${SLUG}.zip" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

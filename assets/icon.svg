<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"
     style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round">
    <style>
        .steam { animation: steam 3s linear infinite; }
        .steam.s2 { animation-delay: -1s; }
        .steam.s3 { animation-delay: -2s; }
        @keyframes steam {
            0%   { transform: translateY(6px);   opacity: 0; }
            15%  { transform: translateY(3px);   opacity: 0.9; }
            100% { transform: translateY(-14px); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .steam { animation: none; opacity: 1; }
        }
    </style>
    <rect width="120" height="120" rx="27" ry="27" style="fill:#2f5d49"/>
    <g transform="translate(-11 7)">
        <path d="M32 58c0 15.36 12.64 28 28 28s28-12.64 28-28z"
              style="fill:none;fill-rule:nonzero;stroke:#fff;stroke-width:5px"/>
        <path d="m88 58 22-7"
              style="fill:none;fill-rule:nonzero;stroke:#fff;stroke-width:5px;stroke-linejoin:miter"/>
        <g style="fill:none;fill-rule:nonzero;stroke:#e2b33c;stroke-width:4.5px;stroke-linejoin:miter">
            <path class="steam s1" d="M46 26q-5 6 0 12t0 12"/>
            <path class="steam s2" d="M60 20q-5 6 0 12t0 12"/>
            <path class="steam s3" d="M74 26q-5 6 0 12t0 12"/>
        </g>
    </g>
</svg>
